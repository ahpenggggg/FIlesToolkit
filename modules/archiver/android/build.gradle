plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.filetoolkit.archiver'
version = '1.0.0'

android {
  namespace "expo.modules.filetoolkit.archiver"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation project(':filetoolkit-folder-access')
  // ZIP: create (AES-256 passwords, split .z01/.z02/… .zip parts) and extract.
  implementation "net.lingala.zip4j:zip4j:2.11.5"
  // RAR (4 and 5, password-protected, multi-part), 7Z and other formats: extract only (JitPack).
  implementation "com.github.omicronapps:7-Zip-JBinding-4Android:Release-16.02-2.03"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
}
