plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.filetoolkit.folderaccess'
version = '1.0.0'

android {
  namespace "expo.modules.filetoolkit.folderaccess"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
}
